# Reasoned allowlist for the linter's own source (self-host: underflow == 0).
#
# Every site below is safe-by-invariant in the source-mapping and marker-run
# helpers, but the underflow rule is deliberately conservative and cannot
# prove it from the local AST, so each carries an explicit rationale.

[[allow]]
path = "src/lib.rs"
rule = "underflow"
snippet = "line_starts[line - 1]"
reason = "1-based span line from proc-macro2 (Span.line >= 1); line_starts[0] is always the source origin"

[[allow]]
path = "src/lib.rs"
rule = "underflow"
snippet = "tokens[i - 1]"
reason = "guarded by the preceding `i > 0` term of the same `&&` condition; i - 1 only read when i > 0"

[[allow]]
path = "src/lib.rs"
rule = "underflow"
snippet = "Some(i - 1)"
reason = "reached only when `i > 0` in the enclosing `if` guard; i - 1 is a valid token index"

[[allow]]
path = "src/lib.rs"
rule = "underflow"
snippet = "tokens[idx - 1]"
reason = "guarded by `while idx >= 2`; idx - 1 is a valid token index because idx >= 2"

[[allow]]
path = "src/lib.rs"
rule = "underflow"
snippet = "tokens[idx - 2]"
reason = "guarded by `while idx >= 2`; idx - 2 is a valid token index because idx >= 2"

[[allow]]
path = "src/lib.rs"
rule = "underflow"
snippet = "idx -= 2"
reason = "inside `while idx >= 2`, idx stays >= 2 so idx - 2 never underflows"

[[allow]]
path = "src/lib.rs"
rule = "underflow"
snippet = "byte_offset - i"
reason = "rposition of the last newline is strictly before byte_offset, so byte_offset > i"
