[package]
name = "aloxstyle-lints"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Source-level Rust lint checker enforcing AloxStyle prose rules."
license = "MIT OR Apache-2.0"

[dependencies]
rustc_lexer = "0.1"
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing"] }

[lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
uninlined_format_args = "warn"
must_use_candidate = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
cast_possible_truncation = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
large_stack_arrays = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
single_match_else = "warn"
nonminimal_bool = "warn"
needless_continue = "warn"
if_not_else = "warn"
unnested_or_patterns = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
assert_is_empty = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
manual_string_new = "warn"
format_push_string = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"
no_effect_underscore_binding = "warn"
used_underscore_binding = "warn"
default_trait_access = "warn"
ignored_unit_patterns = "warn"
struct_field_names = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"
return_self_not_must_use = "warn"
derivable_impls = "warn"
needless_pass_by_value = "warn"
struct_excessive_bools = "warn"
similar_names = "warn"
redundant_clone = "warn"
redundant_else = "warn"
if_then_some_else_none = "warn"
option_if_let_else = "warn"
missing_const_for_fn = "warn"
unused_io_amount = "warn"
empty_loop = "warn"
missing_spin_loop = "warn"
eq_op = "warn"
impossible_comparisons = "warn"
assign_op_pattern = "warn"
bool_comparison = "warn"
len_zero = "warn"
comparison_to_empty = "warn"
identity_op = "warn"
never_loop = "warn"
erasing_op = "warn"
modulo_one = "warn"
min_max = "warn"
self_assignment = "warn"
const_is_empty = "warn"
cast_abs_to_unsigned = "warn"
cast_enum_truncation = "warn"
mut_range_bound = "warn"
infinite_iter = "warn"
while_immutable_condition = "warn"
redundant_comparisons = "warn"
ifs_same_cond = "warn"
precedence = "warn"
range_minus_one = "warn"
suspicious_assignment_formatting = "warn"
match_overlapping_arm = "warn"
mut_from_ref = "warn"
not_unsafe_ptr_arg_deref = "warn"
cast_slice_from_raw_parts = "warn"
cast_slice_different_sizes = "warn"
uninit_assumed_init = "warn"
out_of_bounds_indexing = "warn"
bad_bit_mask = "warn"
ineffective_bit_mask = "warn"
char_indices_as_byte_indices = "warn"
derive_ord_xor_partial_ord = "warn"
derived_hash_with_manual_eq = "warn"
impl_hash_borrow_with_str_and_bytes = "warn"
absurd_extreme_comparisons = "warn"
mistyped_literal_suffixes = "warn"
non_octal_unix_permissions = "warn"
nonsensical_open_options = "warn"
size_of_in_element_count = "warn"
manual_saturating_arithmetic = "warn"
inverted_saturating_sub = "warn"
iterator_step_by_zero = "warn"
zero_repeat_side_effects = "warn"
unconditional_recursion = "warn"
drop_non_drop = "warn"
forget_non_drop = "warn"
infallible_try_from = "warn"
possible_missing_else = "warn"
suspicious_else_formatting = "warn"
suspicious_to_owned = "warn"
unnecessary_to_owned = "warn"
expect_fun_call = "warn"
cmp_owned = "warn"
vec_init_then_push = "warn"
useless_vec = "warn"
large_const_arrays = "warn"
manual_memcpy = "warn"
map_entry = "warn"
manual_retain = "warn"
double_ended_iterator_last = "warn"
large_enum_variant = "warn"
sliced_string_as_bytes = "warn"
get_first = "warn"
assigning_clones = "warn"
cast_possible_wrap = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
manual_is_power_of_two = "warn"
mut_mut = "warn"
naive_bytecount = "warn"
option_as_ref_cloned = "warn"
ptr_as_ptr = "warn"
same_length_and_capacity = "warn"
zero_sized_map_values = "warn"
bind_instead_of_map = "warn"
bytes_count_to_len = "warn"
double_comparisons = "warn"
manual_split_once = "warn"
needless_borrowed_reference = "warn"
no_effect = "warn"
almost_complete_range = "warn"
by_ref_peekable_peek = "warn"
multi_assignments = "warn"
redundant_allocation = "warn"
declare_interior_mutable_const = "warn"
missing_assert_message = "warn"
match_wild_err_arm = "warn"
option_option = "warn"
unchecked_time_subtraction = "warn"
manual_instant_elapsed = "warn"
large_types_passed_by_value = "warn"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
